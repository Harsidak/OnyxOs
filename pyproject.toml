[project]
name = "onyxos"
version = "0.1.0"
description = "OnyxOS — AI-Native Operating System for AR Glasses"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OnyxOS Team"}]

dependencies = [
    "rich>=13.7",
    "textual>=0.80",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "cython>=3.0",
]
inference = [
    "llama-cpp-python>=0.2",
]

[build-system]
requires = ["setuptools>=68", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
onyx-demo = "onyx_hud.dashboard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
